# Render Blueprint for Fana Karaoke.
#
# Rooms and the WebSocket hub live in process memory, so the service must run
# as a single instance (Render's default). The free plan sleeps after 15 minutes
# without traffic, which ends every room: use a paid plan for real events.
#
# The song library lives in Cloudflare D1 through the Worker in workers/library.
# No Render disk and no paid Render plan are required.
services:
  - type: web
    name: fana-karaoke
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Rooms and WebSockets are process-local: never scale beyond one instance.
    numInstances: 1
    autoDeployTrigger: commit
    envVars:
      # Kept stable across deploys so host/device cookies stay valid.
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      # Enables /admin; copy the generated value from the Render dashboard.
      - key: ADMIN_TOKEN
        generateValue: true
      # Durable library. Paste the Worker URL and shared secret in the dashboard
      # after deploying workers/library (see the README runbook).
      - key: LIBRARY_BACKEND
        value: d1
      - key: LIBRARY_PROXY_URL
        sync: false
      - key: LIBRARY_PROXY_TOKEN
        sync: false
      - key: LIBRARY_WARMUP_TIMEOUT
        value: 10s
