# Render Blueprint for Fana Karaoke.
#
# Rooms and the WebSocket hub live in process memory, so the service must run
# as a single instance (Render's default). The free plan sleeps after 15 minutes
# without traffic, which ends every room: use a paid plan for real events.
services:
  - type: web
    name: fana-karaoke
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Kept stable across deploys so host/device cookies stay valid.
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      # Enables /admin; copy the generated value from the Render dashboard.
      - key: ADMIN_TOKEN
        generateValue: true
    # The song library is written to /data/library.sqlite (set in the image).
    # Attach a disk on a paid plan so it survives deploys, then uncomment:
    # disk:
    #   name: library
    #   mountPath: /data
    #   sizeGB: 1
